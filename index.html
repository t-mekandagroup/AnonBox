<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnonBox — Get Anonymous Messages</title>
    <meta name="description" content="Get anonymous messages from your friends and share your favorite messages as beautiful Instagram Stories.">
    
    <!-- SEO & Social -->
    <meta property="og:title" content="AnonBox — Anonymous Messaging">
    <meta property="og:description" content="Send me an anonymous message!">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#7c3aed">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        secondary: '#db2777',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>

    <!-- Icons & Fonts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #7c3aed, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .loader { border-top-color: #7c3aed; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .story-preview { aspect-ratio: 9/16; width: 100%; max-width: 320px; position: relative; overflow: hidden; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        
        /* Ad Containers */
        .ad-container { min-height: 100px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.03); border-radius: 1rem; margin: 1.5rem 0; font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; border: 1px dashed #ccc; }
        .dark .ad-container { background: rgba(255,255,255,0.03); border-color: #444; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- Top Navigation -->
    <nav id="topNav" class="fixed top-0 w-full z-50 px-4 py-3 hidden">
        <div class="max-w-md mx-auto flex justify-between items-center glass rounded-2xl px-4 py-2 shadow-lg">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-lg flex items-center justify-center text-white">
                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg">AnonBox</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i data-lucide="moon" id="darkIcon" class="w-5 h-5"></i>
                </button>
                <div id="navUser" class="hidden">
                     <button onclick="logout()" class="p-2 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- App Container -->
    <div id="app" class="pb-24 pt-4">
        <!-- Views will be injected here -->
        <div id="viewContent" class="max-w-md mx-auto px-4"></div>
    </div>

    <!-- Bottom Navigation (Mobile Only, Auth Users) -->
    <nav id="bottomNav" class="fixed bottom-0 w-full z-50 px-4 pb-6 hidden">
        <div class="max-w-md mx-auto glass rounded-3xl shadow-2xl flex justify-between items-center px-2 py-2">
            <button onclick="navigate('home')" class="nav-btn flex flex-col items-center flex-1 py-2 gap-1 rounded-2xl text-primary transition-all">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium uppercase tracking-tighter">Home</span>
            </button>
            <button onclick="navigate('inbox')" class="nav-btn flex flex-col items-center flex-1 py-2 gap-1 rounded-2xl text-gray-400 relative transition-all">
                <i data-lucide="inbox" class="w-6 h-6"></i>
                <span id="unreadBadge" class="absolute top-1 right-1/4 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                <span class="text-[10px] font-medium uppercase tracking-tighter">Inbox</span>
            </button>
            <button onclick="navigate('story')" class="nav-btn flex flex-col items-center flex-1 py-2 gap-1 rounded-2xl text-gray-400 transition-all">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium uppercase tracking-tighter">Story</span>
            </button>
            <button onclick="navigate('profile')" class="nav-btn flex flex-col items-center flex-1 py-2 gap-1 rounded-2xl text-gray-400 transition-all">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium uppercase tracking-tighter">Profile</span>
            </button>
        </div>
    </nav>

    <!-- Global Loading Overlay -->
    <div id="globalLoader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="loader w-12 h-12 border-4 border-gray-200 rounded-full"></div>
            <p class="text-gray-500 font-medium animate-pulse">Loading AnonBox...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp, updateDoc, deleteDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        // REPLACE THESE WITH YOUR OWN CONFIG FROM FIREBASE CONSOLE
        const firebaseConfig = {
          apiKey: "AIzaSyDXCfNfPDZr7eoHmfmz32uq0jt5PQIf_gY",
          authDomain: "anonbox-66653.firebaseapp.com",
          projectId: "anonbox-66653",
          storageBucket: "anonbox-66653.firebasestorage.app",
          messagingSenderId: "642423328167",
          appId: "1:642423328167:web:67cf7f73ea64e82fbeba82"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- APP STATE ---
        let currentUser = null;
        let userProfile = null;
        let messages = [];
        let isDemoMode = firebaseConfig.apiKey === "YOUR_API_KEY";
        let activeStoryMessage = null;

        // --- INITIALIZATION ---
        window.onload = () => {
            if (isDemoMode) {
                console.warn("AnonBox running in DEMO MODE. Configure Firebase to save data.");
                showToast("Demo Mode Active", "info");
                initApp();
            } else {
                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    if (user) {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        userProfile = userDoc.data();
                        setupRealtimeMessages();
                    }
                    initApp();
                });
            }
        };

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('user');

            document.getElementById('globalLoader').style.display = 'none';
            document.getElementById('topNav').style.display = 'block';

            if (userParam) {
                renderPublicProfile(userParam);
            } else if (currentUser || (isDemoMode && localStorage.getItem('demo_user'))) {
                navigate('home');
            } else {
                renderLanding();
            }
            lucide.createIcons();
        }

        // --- ROUTING / NAVIGATION ---
        window.navigate = (view) => {
            const content = document.getElementById('viewContent');
            const bNav = document.getElementById('bottomNav');
            const navUser = document.getElementById('navUser');
            
            // UI Resets
            window.scrollTo(0, 0);
            bNav.classList.add('hidden');
            navUser.classList.add('hidden');

            if (view === 'landing') renderLanding();
            else if (view === 'login') renderAuth('login');
            else if (view === 'signup') renderAuth('signup');
            else if (view === 'home') {
                navUser.classList.remove('hidden');
                bNav.classList.remove('hidden');
                renderDashboard();
            }
            else if (view === 'inbox') {
                navUser.classList.remove('hidden');
                bNav.classList.remove('hidden');
                renderInbox();
            }
            else if (view === 'story') {
                navUser.classList.remove('hidden');
                bNav.classList.remove('hidden');
                renderStoryMaker();
            }
            else if (view === 'profile') {
                navUser.classList.remove('hidden');
                bNav.classList.remove('hidden');
                renderProfile();
            }
            else if (view === 'settings') {
                navUser.classList.remove('hidden');
                bNav.classList.remove('hidden');
                renderSettings();
            }

            // Update bottom nav active state
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-primary');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.querySelector(`[onclick="navigate('${view}')"]`);
            if(activeBtn) {
                activeBtn.classList.add('text-primary');
                activeBtn.classList.remove('text-gray-400');
            }

            lucide.createIcons();
        };

        // --- VIEWS ---

        function renderLanding() {
            const content = document.getElementById('viewContent');
            content.innerHTML = `
                <div class="pt-12 flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-3xl flex items-center justify-center text-white shadow-2xl mb-8 rotate-3">
                        <i data-lucide="message-circle" class="w-10 h-10"></i>
                    </div>
                    <h1 class="text-4xl font-extrabold mb-4 leading-tight">Get anonymous messages from your <span class="gradient-text">friends 👀</span></h1>
                    <p class="text-gray-500 text-lg mb-10 px-4">Share your link. Let people say what they really think. Totally private, totally anonymous.</p>
                    
                    <div class="w-full space-y-4 px-4">
                        <button onclick="navigate('signup')" class="w-full bg-primary text-white py-4 rounded-2xl font-bold shadow-lg shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all">Create Account</button>
                        <button onclick="navigate('login')" class="w-full bg-white dark:bg-gray-800 py-4 rounded-2xl font-bold shadow-sm border border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all">Login</button>
                    </div>

                    <div class="ad-container ad-landing w-full mt-12">
                        Advertisement Space
                    </div>

                    <div class="mt-16 grid grid-cols-1 gap-8 text-left w-full">
                        <div class="flex gap-4 p-4">
                            <div class="w-12 h-12 bg-purple-100 dark:bg-purple-900/30 text-primary rounded-xl flex-shrink-0 flex items-center justify-center">
                                <i data-lucide="shield-check"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">Anonymous Messages</h3>
                                <p class="text-gray-500 text-sm">Receive honest messages without revealing the sender's identity.</p>
                            </div>
                        </div>
                        <div class="flex gap-4 p-4">
                            <div class="w-12 h-12 bg-pink-100 dark:bg-pink-900/30 text-secondary rounded-xl flex-shrink-0 flex items-center justify-center">
                                <i data-lucide="instagram"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">Instagram Stories</h3>
                                <p class="text-gray-500 text-sm">Turn messages into beautiful Story cards with one click.</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-20 text-gray-400 text-xs pb-10">
                        <p>&copy; 2024 AnonBox. All rights reserved.</p>
                        <div class="flex justify-center gap-4 mt-2">
                            <a href="#">Privacy</a> • <a href="#">Terms</a> • <a href="#">Guidelines</a>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderAuth(type) {
            const content = document.getElementById('viewContent');
            const isLogin = type === 'login';
            content.innerHTML = `
                <div class="pt-10">
                    <button onclick="navigate('landing')" class="mb-6 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                    </button>
                    <h2 class="text-3xl font-bold mb-2">${isLogin ? 'Welcome Back!' : 'Join AnonBox'}</h2>
                    <p class="text-gray-500 mb-8">${isLogin ? 'Sign in to check your messages' : 'Create your account to start receiving messages'}</p>
                    
                    <form id="authForm" class="space-y-4">
                        ${!isLogin ? `
                        <div>
                            <label class="block text-sm font-semibold mb-2 ml-1">Display Name</label>
                            <input type="text" id="authName" placeholder="Your Name" class="w-full bg-white dark:bg-gray-800 border-none rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 ml-1">Username (@)</label>
                            <input type="text" id="authUsername" placeholder="username" class="w-full bg-white dark:bg-gray-800 border-none rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm" required>
                        </div>
                        ` : ''}
                        <div>
                            <label class="block text-sm font-semibold mb-2 ml-1">Email</label>
                            <input type="email" id="authEmail" placeholder="your@email.com" class="w-full bg-white dark:bg-gray-800 border-none rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 ml-1">Password</label>
                            <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-white dark:bg-gray-800 border-none rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm" required>
                        </div>
                        
                        <button type="submit" id="authBtn" class="w-full bg-primary text-white py-4 rounded-2xl font-bold shadow-lg shadow-primary/30 mt-4 flex items-center justify-center">
                            ${isLogin ? 'Sign In' : 'Create Account'}
                        </button>
                    </form>
                    
                    <div class="mt-8 text-center">
                        <button onclick="navigate('${isLogin ? 'signup' : 'login'}')" class="text-sm font-medium text-gray-500">
                            ${isLogin ? "Don't have an account? <span class='text-primary'>Sign Up</span>" : "Already have an account? <span class='text-primary'>Login</span>"}
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('authForm').onsubmit = (e) => {
                e.preventDefault();
                isLogin ? handleLogin() : handleSignup();
            };
        }

        function renderDashboard() {
            const content = document.getElementById('viewContent');
            const username = userProfile?.username || 'user';
            const unreadCount = messages.filter(m => m.status === 'unread').length;

            content.innerHTML = `
                <div class="pt-20">
                    <div class="bg-gradient-to-br from-primary to-secondary p-6 rounded-[2.5rem] text-white shadow-xl mb-8 relative overflow-hidden">
                        <div class="relative z-10">
                            <h2 class="text-sm font-medium opacity-80 mb-1">Welcome back,</h2>
                            <p class="text-2xl font-bold mb-6">${userProfile?.displayName || 'Friend'}</p>
                            
                            <div class="flex gap-4">
                                <div class="bg-white/20 backdrop-blur-md rounded-2xl p-4 flex-1">
                                    <p class="text-xs uppercase font-bold opacity-70 mb-1">Messages</p>
                                    <p class="text-2xl font-black">${messages.length}</p>
                                </div>
                                <div class="bg-white/20 backdrop-blur-md rounded-2xl p-4 flex-1">
                                    <p class="text-xs uppercase font-bold opacity-70 mb-1">Unread</p>
                                    <p class="text-2xl font-black">${unreadCount}</p>
                                </div>
                            </div>
                        </div>
                        <i data-lucide="sparkles" class="absolute -right-4 -bottom-4 w-32 h-32 opacity-10 rotate-12"></i>
                    </div>

                    <div class="glass p-6 rounded-3xl mb-8">
                        <h3 class="font-bold mb-2">Your Personal Link</h3>
                        <p class="text-sm text-gray-500 mb-4">Share this link on your Instagram Story to get messages.</p>
                        <div class="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 p-3 rounded-xl mb-4">
                            <input id="shareUrl" readonly value="${window.location.origin}/?user=${username}" class="bg-transparent border-none text-xs w-full focus:ring-0">
                            <button onclick="copyLink()" class="text-primary hover:scale-110 transition-transform">
                                <i data-lucide="copy" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <button onclick="shareLink()" class="w-full bg-primary text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <i data-lucide="share-2" class="w-4 h-4"></i> Share Link
                        </button>
                    </div>

                    <div class="ad-container ad-inbox">
                        Advertisement Space
                    </div>

                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg">Recent Messages</h3>
                        <button onclick="navigate('inbox')" class="text-primary text-sm font-semibold">View All</button>
                    </div>

                    <div id="recentMessages" class="space-y-4">
                        <!-- Messages loaded via JS -->
                    </div>
                </div>
            `;
            updateRecentMessages();
            lucide.createIcons();
        }

        async function renderPublicProfile(username) {
            const content = document.getElementById('viewContent');
            content.innerHTML = `<div class="flex justify-center pt-20"><div class="loader w-10 h-10 border-4 border-gray-200 rounded-full"></div></div>`;
            
            let targetUser = null;
            if (isDemoMode) {
                targetUser = { username: username, displayName: username, anonymousMessagesEnabled: true, uid: 'demo' };
            } else {
                const q = query(collection(db, "users"), where("username", "==", username.toLowerCase()), limit(1));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    targetUser = querySnapshot.docs[0].data();
                }
            }

            if (!targetUser) {
                content.innerHTML = `<div class="text-center pt-20"><h2 class="text-xl font-bold">User Not Found</h2><button onclick="navigate('landing')" class="text-primary mt-4">Go Home</button></div>`;
                return;
            }

            if (targetUser.anonymousMessagesEnabled === false) {
                content.innerHTML = `<div class="text-center pt-20"><h2 class="text-xl font-bold">Inbox Disabled</h2><p class="text-gray-500">This user is not accepting messages right now.</p></div>`;
                return;
            }

            content.innerHTML = `
                <div class="pt-12 text-center">
                    <div class="w-20 h-20 bg-gray-200 dark:bg-gray-800 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold text-gray-400">
                        ${targetUser.displayName[0]}
                    </div>
                    <h2 class="text-xl font-bold">${targetUser.displayName}</h2>
                    <p class="text-gray-500 text-sm mb-8">@${targetUser.username}</p>

                    <div class="glass p-6 rounded-4xl text-left shadow-2xl">
                        <p class="font-bold text-lg mb-4 text-center">Send me an anonymous message 👀</p>
                        <textarea id="anonMsg" maxlength="300" placeholder="Type something..." class="w-full h-32 bg-gray-50 dark:bg-gray-800/50 rounded-2xl p-4 border-none focus:ring-2 focus:ring-primary resize-none mb-2"></textarea>
                        <div class="flex justify-between items-center text-xs text-gray-400 mb-6">
                            <span id="charCount">0 / 300</span>
                            <span>Truly Anonymous</span>
                        </div>

                        <div class="grid grid-cols-5 gap-2 mb-6">
                            ${['😂', '👀', '🤣', '😈', '🤫'].map(e => `<button onclick="insertEmoji('${e}')" class="bg-gray-100 dark:bg-gray-800 py-2 rounded-xl hover:scale-110 transition-transform">${e}</button>`).join('')}
                        </div>

                        <button onclick="sendMessage('${targetUser.uid}', '${targetUser.username}')" id="sendBtn" class="w-full bg-primary text-white py-4 rounded-2xl font-bold shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                            Send Anonymous Message 🚀
                        </button>
                    </div>

                    <div class="ad-container ad-profile">
                        Advertisement Space
                    </div>

                    <div class="mt-12">
                        <button onclick="navigate('landing')" class="text-primary text-sm font-semibold flex items-center justify-center gap-1 mx-auto">
                            Create your own AnonBox <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('anonMsg').oninput = (e) => {
                document.getElementById('charCount').textContent = `${e.target.value.length} / 300`;
            };
            lucide.createIcons();
        }

        function renderInbox() {
            const content = document.getElementById('viewContent');
            content.innerHTML = `
                <div class="pt-20">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Inbox</h2>
                        <div class="flex gap-2">
                             <button onclick="filterMessages('unread')" class="text-xs bg-primary/10 text-primary px-3 py-1.5 rounded-full font-bold">Unread</button>
                             <button onclick="filterMessages('all')" class="text-xs bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-full font-bold">All</button>
                        </div>
                    </div>

                    <div id="inboxList" class="space-y-4">
                        <!-- Messages -->
                    </div>

                    <div id="emptyInbox" class="hidden text-center py-20">
                        <div class="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                             <i data-lucide="inbox" class="w-8 h-8"></i>
                        </div>
                        <p class="text-gray-500">No messages yet.</p>
                    </div>
                </div>
            `;
            loadInboxMessages();
            lucide.createIcons();
        }

        function renderStoryMaker() {
            const content = document.getElementById('viewContent');
            if (messages.length === 0) {
                content.innerHTML = `<div class="pt-20 text-center px-6"><p class="text-gray-500 mb-4">You need messages to create a story!</p><button onclick="navigate('home')" class="text-primary font-bold">Go Back</button></div>`;
                return;
            }

            const msg = activeStoryMessage || messages[0];
            
            content.innerHTML = `
                <div class="pt-20 pb-10">
                    <h2 class="text-2xl font-bold mb-6">Story Maker</h2>
                    
                    <div class="flex flex-col items-center gap-8">
                        <!-- Story Card -->
                        <div id="storyCapture" class="story-preview bg-gradient-to-br from-primary to-secondary p-8 flex flex-col items-center justify-center text-center text-white">
                            <div class="absolute top-10 left-0 w-full flex justify-center opacity-30">
                                <i data-lucide="message-circle" class="w-40 h-40"></i>
                            </div>
                            
                            <div class="glass bg-white/20 backdrop-blur-xl border-white/30 rounded-3xl p-6 w-full relative z-10 shadow-2xl">
                                <p class="text-[10px] uppercase font-black tracking-widest opacity-70 mb-4">Anonymous Message</p>
                                <p class="text-xl font-bold leading-relaxed mb-6 break-words" id="storyMsgText">${msg.message}</p>
                                <div class="flex items-center justify-center gap-2">
                                    <div class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-[10px] font-bold">
                                        ${userProfile?.displayName[0] || 'A'}
                                    </div>
                                    <span class="text-xs font-semibold">@${userProfile?.username || 'user'}</span>
                                </div>
                            </div>

                            <p class="absolute bottom-10 text-[10px] font-black tracking-[0.3em] uppercase opacity-50">Sent via AnonBox</p>
                        </div>

                        <!-- Themes -->
                        <div class="w-full">
                            <p class="text-sm font-bold mb-3">Choose Theme</p>
                            <div class="flex gap-3 overflow-x-auto pb-4 hide-scrollbar">
                                <button onclick="setTheme('from-purple-600 to-pink-500')" class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-pink-500 flex-shrink-0"></button>
                                <button onclick="setTheme('from-blue-500 to-cyan-400')" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 flex-shrink-0"></button>
                                <button onclick="setTheme('from-orange-500 to-rose-500')" class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-rose-500 flex-shrink-0"></button>
                                <button onclick="setTheme('from-gray-900 to-gray-800')" class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-900 to-gray-800 flex-shrink-0"></button>
                                <button onclick="setTheme('from-green-400 to-blue-500')" class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-blue-500 flex-shrink-0"></button>
                                <button onclick="setTheme('from-indigo-600 to-purple-400')" class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-600 to-purple-400 flex-shrink-0"></button>
                            </div>
                        </div>

                        <button onclick="downloadStory()" class="w-full bg-primary text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/30">
                            <i data-lucide="download" class="w-5 h-5"></i> Download PNG
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderProfile() {
            const content = document.getElementById('viewContent');
            content.innerHTML = `
                <div class="pt-20">
                    <div class="flex flex-col items-center mb-8">
                        <div class="w-24 h-24 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center text-white text-3xl font-bold mb-4 shadow-lg">
                            ${userProfile?.displayName[0]}
                        </div>
                        <h2 class="text-2xl font-bold">${userProfile?.displayName}</h2>
                        <p class="text-gray-500">@${userProfile?.username}</p>
                    </div>

                    <div class="space-y-3">
                        <div class="glass p-4 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="link" class="text-primary w-5 h-5"></i>
                                <span class="font-medium">Public Profile</span>
                            </div>
                            <button onclick="window.open('/?user=${userProfile.username}', '_blank')" class="text-xs font-bold text-primary">Preview</button>
                        </div>
                        <div class="glass p-4 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="shield" class="text-primary w-5 h-5"></i>
                                <span class="font-medium">Accept Messages</span>
                            </div>
                            <input type="checkbox" ${userProfile.anonymousMessagesEnabled ? 'checked' : ''} onchange="toggleInbox(this.checked)" class="w-5 h-5 accent-primary">
                        </div>
                        <button onclick="navigate('settings')" class="w-full glass p-4 rounded-2xl flex items-center gap-3">
                            <i data-lucide="settings" class="text-gray-500 w-5 h-5"></i>
                            <span class="font-medium">Settings</span>
                        </button>
                        <button onclick="logout()" class="w-full glass p-4 rounded-2xl flex items-center gap-3 text-red-500">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                            <span class="font-medium">Logout</span>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- ACTIONS & LOGIC ---

        async function handleSignup() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            const name = document.getElementById('authName').value;
            const username = document.getElementById('authUsername').value.toLowerCase().replace(/[^a-z0-9_]/g, '');
            
            if (username.length < 3) return showToast("Username too short", "error");
            
            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white rounded-full"></div>';

            try {
                // Check if username taken
                const q = query(collection(db, "users"), where("username", "==", username));
                const snap = await getDocs(q);
                if (!snap.empty) throw new Error("Username already taken");

                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                const userData = {
                    uid: userCred.user.uid,
                    displayName: name,
                    username: username,
                    email: email,
                    createdAt: serverTimestamp(),
                    anonymousMessagesEnabled: true,
                    unreadCount: 0
                };
                
                await setDoc(doc(db, "users", userCred.user.uid), userData);
                userProfile = userData;
                showToast("Account Created!");
                navigate('home');
            } catch (err) {
                showToast(err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Create Account";
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            
            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white rounded-full"></div>';

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                showToast("Welcome Back!");
                navigate('home');
            } catch (err) {
                showToast("Invalid credentials", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }

        async function logout() {
            if(confirm("Logout?")) {
                await signOut(auth);
                currentUser = null;
                userProfile = null;
                messages = [];
                navigate('landing');
            }
        }

        function setupRealtimeMessages() {
            if (!currentUser) return;
            const q = query(collection(db, "messages"), where("recipientUid", "==", currentUser.uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateUnreadBadge();
                if (document.getElementById('recentMessages')) updateRecentMessages();
                if (document.getElementById('inboxList')) loadInboxMessages();
            });
        }

        function updateUnreadBadge() {
            const unread = messages.filter(m => m.status === 'unread').length;
            const badge = document.getElementById('unreadBadge');
            if (badge) {
                badge.style.display = unread > 0 ? 'block' : 'none';
            }
        }

        function updateRecentMessages() {
            const container = document.getElementById('recentMessages');
            if (!container) return;
            
            const recent = messages.slice(0, 3);
            if (recent.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No messages yet... Share your link!</div>`;
                return;
            }

            container.innerHTML = recent.map(m => `
                <div onclick="openMessage('${m.id}')" class="glass p-4 rounded-2xl flex items-start gap-4 active:scale-95 transition-transform cursor-pointer">
                    <div class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i data-lucide="message-square" class="w-5 h-5 text-gray-400"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold mb-0.5 ${m.status === 'unread' ? 'text-primary' : 'text-gray-500'}">Anonymous</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400 truncate">${m.message}</p>
                    </div>
                    <span class="text-[10px] text-gray-400">${timeAgo(m.createdAt?.toDate())}</span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function loadInboxMessages() {
            const container = document.getElementById('inboxList');
            const empty = document.getElementById('emptyInbox');
            if (!container) return;

            if (messages.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            container.innerHTML = messages.map(m => `
                <div class="glass p-5 rounded-3xl relative group">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                             <div class="w-2 h-2 rounded-full ${m.status === 'unread' ? 'bg-primary' : 'bg-transparent'}"></div>
                             <span class="text-xs font-bold text-gray-400 uppercase tracking-tighter">Anonymous • ${timeAgo(m.createdAt?.toDate())}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="deleteMessage('${m.id}')" class="p-1.5 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <p class="text-gray-800 dark:text-gray-200 mb-6 leading-relaxed">${m.message}</p>
                    <div class="flex gap-2">
                        <button onclick="makeStory('${m.id}')" class="flex-1 bg-primary/10 text-primary py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Make Story
                        </button>
                        <button onclick="markAsRead('${m.id}', '${m.status}')" class="flex-1 bg-gray-100 dark:bg-gray-800 text-gray-500 py-2.5 rounded-xl text-xs font-bold">
                            ${m.status === 'unread' ? 'Mark Read' : 'Unread'}
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function sendMessage(uid, username) {
            const msg = document.getElementById('anonMsg').value.trim();
            if (!msg) return;

            // Simple Cooldown check
            const lastSent = localStorage.getItem(`cooldown_${uid}`);
            if (lastSent && Date.now() - lastSent < 30000) {
                return showToast("Slow down! 30s cooldown", "error");
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white rounded-full"></div>';

            try {
                if (isDemoMode) {
                    showToast("Demo: Message 'sent' locally");
                } else {
                    await addDoc(collection(db, "messages"), {
                        recipientUid: uid,
                        recipientUsername: username,
                        message: msg,
                        status: 'unread',
                        createdAt: serverTimestamp(),
                        reportCount: 0
                    });
                }

                localStorage.setItem(`cooldown_${uid}`, Date.now());
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#7c3aed', '#db2777'] });
                
                document.getElementById('viewContent').innerHTML = `
                    <div class="pt-20 text-center px-6">
                        <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="check" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-bold mb-2">Message Sent!</h2>
                        <p class="text-gray-500 mb-8">Your anonymous message was delivered to @${username}.</p>
                        <button onclick="location.reload()" class="w-full bg-primary text-white py-4 rounded-2xl font-bold">Send Another</button>
                    </div>
                `;
                lucide.createIcons();
            } catch (err) {
                showToast("Failed to send", "error");
                btn.disabled = false;
                btn.innerText = "Send Anonymous Message 🚀";
            }
        }

        async function markAsRead(id, currentStatus) {
            if (isDemoMode) return;
            const newStatus = currentStatus === 'unread' ? 'read' : 'unread';
            await updateDoc(doc(db, "messages", id), { status: newStatus });
        }

        async function deleteMessage(id) {
            if (!confirm("Delete message?")) return;
            if (isDemoMode) return;
            await deleteDoc(doc(db, "messages", id));
        }

        function makeStory(id) {
            activeStoryMessage = messages.find(m => m.id === id);
            navigate('story');
        }

        function setTheme(classes) {
            const el = document.getElementById('storyCapture');
            el.className = `story-preview p-8 flex flex-col items-center justify-center text-center text-white bg-gradient-to-br ${classes}`;
        }

        function downloadStory() {
            const capture = document.getElementById('storyCapture');
            showToast("Generating image...", "info");
            
            html2canvas(capture, {
                scale: 3,
                useCORS: true,
                backgroundColor: null,
                width: 320,
                height: 568
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `anonbox-story-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("Downloaded! ✨");
            });
        }

        async function toggleInbox(val) {
            if (isDemoMode) return;
            await updateDoc(doc(db, "users", currentUser.uid), { anonymousMessagesEnabled: val });
            userProfile.anonymousMessagesEnabled = val;
            showToast(val ? "Inbox Enabled" : "Inbox Disabled");
        }

        // --- UTILS ---

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('darkIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-2xl shadow-xl font-bold text-sm transition-all duration-300 translate-y-10 opacity-0 ${type === 'success' ? 'bg-green-500 text-white' : (type === 'error' ? 'bg-red-500 text-white' : 'bg-primary text-white')}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('anonMsg');
            input.value += emoji;
            input.dispatchEvent(new Event('input'));
        }

        function timeAgo(date) {
            if (!date) return '...';
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m";
            return "now";
        }

        window.copyLink = () => {
            const url = document.getElementById('shareUrl').value;
            navigator.clipboard.writeText(url);
            showToast("Copied to clipboard!");
        };

        window.shareLink = () => {
            const url = document.getElementById('shareUrl').value;
            if (navigator.share) {
                navigator.share({ title: 'AnonBox', text: 'Send me an anonymous message! 👀', url: url });
            } else {
                copyLink();
            }
        };

    </script>
</body>
</html>
